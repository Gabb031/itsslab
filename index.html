<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITSSLab</title>
<style>
  /* Paleta tomada del logo institucional */
  :root {
    --rojo: #A91D22;
    --rojo-oscuro: #8A171B;      /* hover del rojo */
    --rojo-suave: #FBE9EA;       /* variante clara del rojo */
    --azul: #101828;
    --blanco: #FFFFFF;
    --gris: #D0D5DD;
    --gris-claro: #F2F4F7;       /* variante clara del gris: fondo general */
    --grid: #E4E7EC;             /* cuadrícula del fondo */
    --muted: #475467;            /* texto secundario */
    --line: #D0D5DD;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--azul);
    background-color: var(--gris-claro);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; }

  header {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--azul); color: var(--blanco);
    padding: 20px 24px; border-radius: 12px; border-bottom: 6px solid var(--rojo);
  }
  .brand { display: flex; align-items: center; justify-content: flex-start; gap: 16px; }
  .header-logo { height: 72px; width: auto; border-radius: 8px; flex-shrink: 0; background: var(--blanco); }
  h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: -0.02em; line-height: 1.05; }
  .sub { margin: 8px 0 0; color: var(--gris); max-width: 46ch; }

  .lang { display: flex; border: 2px solid var(--blanco); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; background: transparent; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; color: var(--blanco); }
  .lang button[aria-pressed="true"] { background: var(--rojo); color: var(--blanco); }

  .filters { margin: 24px 0 8px; padding: 14px 16px; background: var(--blanco); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 12px; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .group > span { font-weight: 600; min-width: 92px; }
  .chip { border: 1.5px solid var(--line); background: var(--blanco); border-radius: 999px; padding: 5px 14px; font: inherit; cursor: pointer; color: var(--azul); display: inline-flex; align-items: center; gap: 7px; }
  .chip:hover { border-color: var(--azul); }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--azul)); }
  .chip[aria-pressed="true"] { border-color: var(--azul); background: var(--azul); color: var(--blanco); }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--rojo); outline-offset: 2px; }
  header button:focus-visible { outline-color: var(--blanco); }

  .count { margin: 14px 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--blanco); border: 1px solid var(--line); border-left: 8px solid var(--c, var(--azul)); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-size: 1.25rem; }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 0.82rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--azul)); }
  .pill.materia { background: var(--rojo-suave); border-color: var(--rojo-suave); color: var(--rojo); font-weight: 600; }
  .ads { font-size: 0.82rem; color: var(--muted); }
  .visit { align-self: flex-start; text-decoration: none; background: var(--rojo); color: var(--blanco); padding: 8px 16px; border-radius: 8px; font-weight: 600; }
  .visit:hover { background: var(--rojo-oscuro); }
  .msg { background: var(--blanco); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  footer { margin-top: 36px; color: var(--muted); font-size: 0.9rem; }

  .wrap { padding-bottom: 104px; }
  .music { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 6px; background: var(--azul); color: var(--blanco); padding: 6px 12px 6px 6px; border-radius: 999px; border: 2px solid var(--rojo); box-shadow: 0 4px 16px rgba(16,24,40,.35); max-width: calc(100% - 32px); }
  .m-btn { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--blanco); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .m-btn:hover { background: rgba(255,255,255,.15); }
  .m-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .m-main { background: var(--rojo); width: 42px; height: 42px; }
  .m-main:hover { background: var(--rojo-oscuro); }
  .m-title { font-size: 0.85rem; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .m-vol { width: 80px; accent-color: var(--rojo); cursor: pointer; }
  .music button:focus-visible, .music input:focus-visible { outline: 3px solid var(--blanco); outline-offset: 2px; }
  @media (max-width: 520px) {
    .music { left: 12px; right: 12px; justify-content: space-between; }
    .m-title { max-width: 110px; }
    .m-vol { width: 60px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="assets/str.png"
           alt="Instituto Técnico en Sistemas Santa Rosa de Lima"
           class="header-logo">
      <div>
        <h1>ITSSLab</h1>
        <p class="sub" id="sub"></p>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="btn-es" aria-pressed="true">ES</button>
      <button id="btn-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="filters" aria-label="Filtros">
    <div class="group"><span id="lbl-subject"></span><div class="group" id="subjects"></div></div>
    <div class="group"><span id="lbl-level"></span><div class="group" id="levels"></div></div>
    <div class="group"><span id="lbl-lang"></span><div class="group" id="langs"></div></div>
  </section>

  <p class="count" id="count" aria-live="polite"></p>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>

<div class="music" id="music" role="group">
  <button class="m-btn m-main" id="m-play" type="button"></button>
  <span class="m-title" id="m-title" aria-live="polite"></span>
  <button class="m-btn" id="m-prev" type="button"></button>
  <button class="m-btn" id="m-next" type="button"></button>
  <input class="m-vol" id="m-vol" type="range" min="0" max="1" step="0.05" value="0.5">
</div>

<script>
const T = {
  es: {
    sub: "Plataformas gratuitas para aprender matemáticas e inglés, de preescolar a la universidad.",
    subject: "Materia", level: "Nivel", lang: "Idioma", all: "Todos", visit: "Ir a la plataforma",
    ads: "Muestra publicidad", count: n => n + (n === 1 ? " plataforma" : " plataformas"),
    none: "Ninguna plataforma coincide con estos filtros. Prueba con otra materia, nivel o idioma.",
    error: "No se pudo cargar plataformas.json. Abre la página desde su dirección en GitHub Pages, no como archivo en tu computador.",
    foot: "ITSSLab solo te lleva a cada plataforma; el contenido pertenece a sus autores.",
    names: { es: "Español", en: "Inglés" },
    music: "Música de fondo", musicOff: "Música apagada", play: "Reproducir música", pause: "Pausar música", prev: "Pista anterior", next: "Pista siguiente", vol: "Volumen",
    musicNote: "La música es original, generada por código, sin obras de terceros."
  },
  en: {
    sub: "Free platforms to learn math and English, from preschool to university.",
    subject: "Subject", level: "Level", lang: "Language", all: "All", visit: "Visit platform",
    ads: "Shows ads", count: n => n + (n === 1 ? " platform" : " platforms"),
    none: "No platform matches these filters. Try another subject, level or language.",
    error: "Could not load plataformas.json. Open the page from its GitHub Pages address, not as a file on your computer.",
    foot: "ITSSLab only links to each platform; the content belongs to its authors.",
    names: { es: "Spanish", en: "English" },
    music: "Background music", musicOff: "Music off", play: "Play music", pause: "Pause music", prev: "Previous track", next: "Next track", vol: "Volume",
    musicNote: "The music is original, generated by code, with no third-party works."
  }
};

let data = null, lang = "es", fSubject = "all", fLevel = "all", fLang = "all";
const $ = id => document.getElementById(id);

function chip(label, pressed, onClick, color) {
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", pressed);
  if (color) { b.style.setProperty("--c", color); b.innerHTML = '<span class="dot"></span>'; }
  b.append(label);
  b.onclick = onClick;
  return b;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("sub").textContent = t.sub;
  $("lbl-subject").textContent = t.subject;
  $("lbl-level").textContent = t.level;
  $("lbl-lang").textContent = t.lang;
  $("foot").textContent = t.foot + " " + t.musicNote;
  updateMusicUI();
  $("btn-es").setAttribute("aria-pressed", lang === "es");
  $("btn-en").setAttribute("aria-pressed", lang === "en");

  const subjects = $("subjects"); subjects.innerHTML = "";
  subjects.append(chip(t.all, fSubject === "all", () => { fSubject = "all"; render(); }));
  for (const [k, v] of Object.entries(data.materias))
    subjects.append(chip(v[lang], fSubject === k, () => { fSubject = k; render(); }));

  const levels = $("levels"); levels.innerHTML = "";
  levels.append(chip(t.all, fLevel === "all", () => { fLevel = "all"; render(); }));
  for (const [k, v] of Object.entries(data.niveles))
    levels.append(chip(v[lang], fLevel === k, () => { fLevel = k; render(); }, v.color));

  const langs = $("langs"); langs.innerHTML = "";
  langs.append(chip(t.all, fLang === "all", () => { fLang = "all"; render(); }));
  for (const k of ["es", "en"])
    langs.append(chip(t.names[k], fLang === k, () => { fLang = k; render(); }));

  const list = data.plataformas.filter(p =>
    (fSubject === "all" || (p.materia || ["matematicas"]).includes(fSubject)) &&
    (fLevel === "all" || p.niveles.includes(fLevel)) &&
    (fLang === "all" || p.idiomas.includes(fLang)));

  $("count").textContent = t.count(list.length);
  const grid = $("grid"); grid.innerHTML = "";
  if (!list.length) { grid.innerHTML = '<p class="msg"></p>'; grid.firstChild.textContent = t.none; return; }

  for (const p of list) {
    const first = data.niveles[p.niveles[0]];
    const card = document.createElement("article");
    card.className = "card";
    card.style.setProperty("--c", first.color);

    const h = document.createElement("h2"); h.textContent = p.nombre;
    const d = document.createElement("p"); d.textContent = p.descripcion[lang];

    const pills = document.createElement("div"); pills.className = "pills";
    for (const m of (p.materia || ["matematicas"])) {
      const s = document.createElement("span"); s.className = "pill materia";
      s.textContent = data.materias[m][lang];
      pills.append(s);
    }
    for (const k of p.niveles) {
      const s = document.createElement("span"); s.className = "pill";
      s.style.setProperty("--c", data.niveles[k].color);
      s.innerHTML = '<span class="dot"></span>'; s.append(data.niveles[k][lang]);
      pills.append(s);
    }
    const langPill = document.createElement("span"); langPill.className = "pill";
    langPill.textContent = p.idiomas.map(k => k.toUpperCase()).join(" / ");
    pills.append(langPill);

    const a = document.createElement("a");
    a.className = "visit"; a.href = p.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = t.visit;

    card.append(h, pills, d);
    if (p.publicidad) { const ad = document.createElement("span"); ad.className = "ads"; ad.textContent = t.ads; card.append(ad); }
    card.append(a);
    grid.append(card);
  }
}

$("btn-es").onclick = () => { lang = "es"; render(); };
$("btn-en").onclick = () => { lang = "en"; render(); };

// MUSIC-START
// Música original generada por código con Web Audio: sin archivos de audio ni obras de terceros.
const Music = (() => {
  const TRACKS = [
    { name: { es: "Mañana tranquila",  en: "Quiet morning"   }, root: 60, scale: [0,2,4,7,9],        bpm: 72, prog: [0,3,4,2], seed: 11 },
    { name: { es: "Jardín de números", en: "Number garden"   }, root: 67, scale: [0,2,4,7,9],        bpm: 84, prog: [0,2,3,1], seed: 23 },
    { name: { es: "Tarde de estudio",  en: "Study afternoon" }, root: 62, scale: [0,2,3,5,7,9,10],   bpm: 66, prog: [0,3,5,4], seed: 37 },
    { name: { es: "Luciérnagas",       en: "Fireflies"       }, root: 57, scale: [0,3,5,7,10],       bpm: 60, prog: [0,2,1,3], seed: 51 }
  ];
  const TRACK_SECONDS = 100;
  let ctx = null, master = null, delay = null, tb = null, timer = null;
  let cur = 0, playing = false, nextTime = 0, step = 0, rand = null, trackStart = 0, lastDeg = 7;
  let vol = 0.5, onChange = () => {};

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function midi(t, deg) {
    const n = t.scale.length;
    return t.root + 12 * Math.floor(deg / n) + t.scale[((deg % n) + n) % n];
  }

  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = vol;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 3200;
    master.connect(lp); lp.connect(ctx.destination);
    delay = ctx.createDelay(1.0);
    delay.delayTime.value = 0.375;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const dl = ctx.createBiquadFilter(); dl.type = "lowpass"; dl.frequency.value = 1800;
    const wet = ctx.createGain(); wet.gain.value = 0.5;
    delay.connect(dl); dl.connect(fb); fb.connect(delay);
    dl.connect(wet); wet.connect(master);
  }

  function makeBus() {
    const bus = ctx.createGain(), mel = ctx.createGain(), send = ctx.createGain();
    send.gain.value = 0.4;
    bus.connect(master);
    mel.connect(bus);
    mel.connect(send); send.connect(delay);
    return { bus, mel, send };
  }

  function tone(dest, freq, t0, dur, peak, type, attack, rel) {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + rel);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + rel + 0.05);
  }

  function scheduleStep() {
    const t = TRACKS[cur];
    const eighth = 60 / t.bpm / 2;
    const bar = Math.floor(step / 8), pos = step % 8;
    const chord = t.prog[bar % t.prog.length];
    const time = nextTime;
    if (pos === 0) {
      const barLen = eighth * 8;
      [0, 2, 4].forEach(d => tone(tb.bus, hz(midi(t, chord + d)), time, barLen * 0.95, 0.045, "triangle", 0.7, 1.2));
      tone(tb.bus, hz(midi(t, chord) - 24), time, barLen * 0.9, 0.07, "sine", 0.3, 0.8);
    }
    if (rand() < (pos % 2 === 0 ? 0.55 : 0.3)) {
      let d = lastDeg + Math.floor(rand() * 5) - 2;
      d = Math.max(3, Math.min(11, d));
      lastDeg = d;
      tone(tb.mel, hz(midi(t, d) + 12), time, eighth * 1.5, 0.06, "sine", 0.01, 0.9);
      if (rand() < 0.25) tone(tb.mel, hz(midi(t, d) + 24), time, eighth, 0.015, "triangle", 0.01, 0.5);
    }
    step++;
    nextTime += eighth;
  }

  function go(i) {
    const idx = (i + TRACKS.length) % TRACKS.length;
    if (tb) {
      const old = tb, now = ctx.currentTime;
      old.bus.gain.cancelScheduledValues(now);
      old.bus.gain.setTargetAtTime(0, now, 0.15);
      old.send.gain.setTargetAtTime(0, now, 0.15);
      setTimeout(() => { try { old.mel.disconnect(); old.bus.disconnect(); old.send.disconnect(); } catch (e) {} }, 1500);
    }
    cur = idx;
    tb = makeBus();
    rand = mulberry32(TRACKS[cur].seed);
    step = 0; lastDeg = 7;
    trackStart = ctx.currentTime;
    nextTime = ctx.currentTime + 0.15;
    tb.bus.gain.setValueAtTime(0.0001, ctx.currentTime);
    tb.bus.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.5);
    onChange(cur);
  }

  function tick() {
    if (!playing) return;
    while (nextTime < ctx.currentTime + 0.5) scheduleStep();
    if (ctx.currentTime - trackStart > TRACK_SECONDS) go(cur + 1);
  }

  async function toggle() {
    ensure();
    if (!playing) {
      if (ctx.state === "suspended") await ctx.resume();
      playing = true;
      if (!tb) go(cur);
      if (!timer) timer = setInterval(tick, 100);
    } else {
      playing = false;
      await ctx.suspend();
    }
    return playing;
  }

  async function move(delta) {
    if (!ctx) { cur = (cur + delta + TRACKS.length) % TRACKS.length; onChange(cur); return; }
    go(cur + delta);
    if (!playing) await toggle();
  }

  return {
    init(cb) { onChange = cb; cb(cur); },
    toggle,
    next: () => move(1),
    prev: () => move(-1),
    setVolume(v) { vol = v; if (master) master.gain.setTargetAtTime(v, ctx.currentTime, 0.05); },
    isPlaying: () => playing,
    name: (i, lang) => TRACKS[i].name[lang] || TRACKS[i].name.es,
    count: TRACKS.length
  };
})();
// MUSIC-END

const ICONS = {
  play:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next:  '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>'
};
let trackIdx = 0;
function updateMusicUI() {
  const t = T[lang], on = Music.isPlaying();
  $("music").setAttribute("aria-label", t.music);
  $("m-play").innerHTML = on ? ICONS.pause : ICONS.play;
  $("m-play").setAttribute("aria-label", on ? t.pause : t.play);
  $("m-play").setAttribute("aria-pressed", on);
  $("m-prev").innerHTML = ICONS.prev; $("m-prev").setAttribute("aria-label", t.prev);
  $("m-next").innerHTML = ICONS.next; $("m-next").setAttribute("aria-label", t.next);
  $("m-vol").setAttribute("aria-label", t.vol);
  $("m-title").textContent = on ? Music.name(trackIdx, lang) : t.musicOff;
}
Music.init(i => { trackIdx = i; updateMusicUI(); });
$("m-play").onclick = async () => { await Music.toggle(); updateMusicUI(); };
$("m-prev").onclick = async () => { await Music.prev(); updateMusicUI(); };
$("m-next").onclick = async () => { await Music.next(); updateMusicUI(); };
$("m-vol").oninput = e => Music.setVolume(parseFloat(e.target.value));

fetch("plataformas.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => { data = j; render(); })
  .catch(() => { $("count").textContent = ""; const m = document.createElement("p"); m.className = "msg"; m.textContent = T.es.error; $("grid").append(m); });
</script>
</body>
</html>
